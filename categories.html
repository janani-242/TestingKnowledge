<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Categories | Quizora'26</title>

    <!-- GOOGLE FONT -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- CATEGORIES CSS -->
    <link rel="stylesheet" href="categories.css">


    <style>

        /* =========================================
           ADMIN LOGO
        ========================================= */

        #adminLogo {

            cursor: pointer;

            user-select: none;

            display: inline-block;

            transition: .25s ease;

        }

        #adminLogo:hover {

            transform: scale(1.08);

            filter:
                drop-shadow(
                    0 0 12px rgba(59,130,246,.55)
                );

        }


        /* =========================================
           ADMIN POPUP OVERLAY
        ========================================= */

        .admin-modal {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 9999;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(2,8,23,.72);

            backdrop-filter: blur(8px);

            -webkit-backdrop-filter: blur(8px);

        }


        .admin-modal.show {

            display: flex;

        }


        /* =========================================
           POPUP BOX
        ========================================= */

        .admin-modal-box {

            width: 100%;

            max-width: 390px;

            padding: 32px 28px;

            text-align: center;

            border-radius: 24px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.12),
                    rgba(255,255,255,.06)
                );

            border: 1px solid
                rgba(255,255,255,.20);

            backdrop-filter: blur(25px);

            -webkit-backdrop-filter: blur(25px);

            box-shadow:

                0 25px 70px
                rgba(0,0,0,.45),

                0 0 35px
                rgba(59,130,246,.12);

            animation:
                adminPopup .25s ease;

        }


        /* =========================================
           POPUP ANIMATION
        ========================================= */

        @keyframes adminPopup {

            from {

                opacity: 0;

                transform:
                    scale(.88)
                    translateY(15px);

            }

            to {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);

            }

        }


        /* =========================================
           LOCK ICON
        ========================================= */

        .admin-lock {

            width: 70px;

            height: 70px;

            margin:
                0 auto 17px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;

            background:
                linear-gradient(
                    135deg,
                    #163c82,
                    #0b2048
                );

            border: 1px solid
                rgba(255,255,255,.20);

            box-shadow:

                0 10px 25px
                rgba(0,0,0,.30),

                0 0 25px
                rgba(59,130,246,.20);

        }


        /* =========================================
           TITLE
        ========================================= */

        .admin-modal-box h2 {

            margin:
                0 0 7px;

            color:
                #ffffff;

            font-size: 22px;

            font-weight: 600;

        }


        /* =========================================
           DESCRIPTION
        ========================================= */

        .admin-modal-box p {

            margin:
                0 0 20px;

            color:
                #d4dce7;

            font-size: 13px;

        }


        /* =========================================
           PASSWORD INPUT
        ========================================= */

        .admin-input {

            width: 100%;

            box-sizing: border-box;

            padding:
                13px 15px;

            border:
                1px solid
                rgba(255,255,255,.18);

            border-radius: 12px;

            outline: none;

            background:
                rgba(255,255,255,.08);

            color:
                #ffffff;

            font-family:
                Poppins,
                sans-serif;

            font-size: 14px;

            margin-bottom: 8px;

            transition: .2s;

        }


        .admin-input::placeholder {

            color:
                #aebbd0;

        }


        .admin-input:focus {

            border-color:
                rgba(255,255,255,.45);

            box-shadow:
                0 0 0 3px
                rgba(59,130,246,.12);

        }


        /* =========================================
           ERROR
        ========================================= */

        .admin-error {

            display: none;

            color:
                #ff8f8f;

            font-size: 12px;

            margin:
                5px 0 12px;

        }


        /* =========================================
           BUTTONS
        ========================================= */

        .admin-buttons {

            display: flex;

            gap: 10px;

            margin-top: 10px;

        }


        .admin-buttons button {

            flex: 1;

            border: none;

            padding: 12px;

            border-radius: 11px;

            font-family:
                Poppins,
                sans-serif;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            transition: .2s;

        }


        /* CANCEL */

        .admin-cancel {

            background:
                rgba(255,255,255,.10);

            color:
                #d9e2ef;

            border:
                1px solid
                rgba(255,255,255,.12)
                !important;

        }


        .admin-cancel:hover {

            background:
                rgba(255,255,255,.16);

        }


        /* LOGIN */

        .admin-login {

            background:
                linear-gradient(
                    135deg,
                    #163c82,
                    #0b2048
                );

            color:
                #ffffff;

            border:
                1px solid
                rgba(255,255,255,.18) !important;

            box-shadow:
                0 7px 20px
                rgba(0,0,0,.25);

        }


        .admin-login:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(59,130,246,.20);

        }

    </style>

<link rel="stylesheet" href="nav.css">
</head>


<body data-require="login" data-back="login.html" data-back-label="Back">


<div class="container">


    <!-- =========================================
         HEADER
    ========================================== -->

    <div class="header">

        <h1>

            <!-- 4 CLICKS REQUIRED -->

            <span
                id="adminLogo"
                title="Quizora"
            >
                📚
            </span>

            Quiz Categories

        </h1>


        <p>
            Select a category to start your quiz.
        </p>


        <p>

            <a href="leaderboard.html">
                🏅 View Leaderboard
            </a>

        </p>

    </div>



    <!-- =========================================
         CATEGORY GRID
    ========================================== -->

    <div class="category-container">


        <!-- GENERAL KNOWLEDGE -->

        <div
            class="category-card"
            data-category="general-knowledge"
        >

            <span class="icon">
                🧠
            </span>

            <h3>
                General Knowledge
            </h3>

        </div>


        <!-- CURRENT AFFAIRS -->

        <div
            class="category-card"
            data-category="current-affairs"
        >

            <span class="icon">
                📰
            </span>

            <h3>
                Current Affairs
            </h3>

        </div>


        <!-- SCIENCE -->

        <div
            class="category-card"
            data-category="science"
        >

            <span class="icon">
                🔬
            </span>

            <h3>
                Science &amp; Technology
            </h3>

        </div>


        <!-- COMPUTER SCIENCE -->

        <div
            class="category-card"
            data-category="computer-science"
        >

            <span class="icon">
                💻
            </span>

            <h3>
                Computer Science
            </h3>

        </div>


        <!-- RIDDLES -->

        <div
            class="category-card"
            data-category="riddles"
        >

            <span class="icon">
                🧩
            </span>

            <h3>
                Riddles
            </h3>

        </div>


    </div>


</div>



<!-- =========================================
     ADMIN POPUP
========================================== -->

<div
    id="adminModal"
    class="admin-modal"
>

    <div
        class="admin-modal-box"
        onclick="event.stopPropagation()"
    >

        <div class="admin-lock">
            🔐
        </div>


        <h2>
            Admin Access
        </h2>


        <p>
            Enter the admin password to continue
        </p>


        <input
            type="password"
            id="adminSecret"
            class="admin-input"
            placeholder="Enter password"
            autocomplete="off"
        >


        <div
            id="adminError"
            class="admin-error"
        >
            ❌ Incorrect password. Try again.
        </div>


        <div class="admin-buttons">

            <button
                type="button"
                class="admin-cancel"
                onclick="closeAdminModal()"
            >
                Cancel
            </button>


            <button
                type="button"
                class="admin-login"
                onclick="checkAdminPassword()"
            >
                Login
            </button>

        </div>

    </div>

</div>



<!-- CATEGORIES JS -->

<script src="categories.js"></script>



<!-- =========================================
     ADMIN ACCESS JS
========================================== -->

<script>

    const adminLogo =
        document.getElementById("adminLogo");

    const adminModal =
        document.getElementById("adminModal");

    const adminSecret =
        document.getElementById("adminSecret");

    const adminError =
        document.getElementById("adminError");


    /* =========================================
       LOGO CLICK COUNTER
    ========================================== */

    let logoClicks = 0;

    let clickTimer = null;


    adminLogo.addEventListener(
        "click",
        function () {

            logoClicks++;


            /*
             * Reset if the 4 clicks
             * are not completed quickly
             */

            clearTimeout(clickTimer);

            clickTimer = setTimeout(
                function () {

                    logoClicks = 0;

                },
                1500
            );


            /*
             * EXACTLY 4 CLICKS
             */

            if (logoClicks === 4) {

                clearTimeout(clickTimer);

                logoClicks = 0;


                /* Open popup */

                adminModal.classList.add("show");


                /* Clear old data */

                adminSecret.value = "";

                adminError.style.display =
                    "none";


                /* Focus password */

                setTimeout(
                    function () {

                        adminSecret.focus();

                    },
                    150
                );

            }

        }
    );



    /* =========================================
       CHECK PASSWORD
    ========================================== */

    function checkAdminPassword() {

        const password =
            adminSecret.value.trim();


        /*
         * ADMIN PASSWORD
         */

        if (password === "2006") {

            window.location.href =
                "admin.html";

        }

        else {

            adminError.style.display =
                "block";

            adminSecret.value = "";

            adminSecret.focus();

        }

    }



    /* =========================================
       CLOSE POPUP
    ========================================== */

    function closeAdminModal() {

        adminModal.classList.remove("show");

        adminSecret.value = "";

        adminError.style.display =
            "none";

    }



    /* =========================================
       ENTER KEY
    ========================================== */

    adminSecret.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                checkAdminPassword();

            }

        }
    );



    /* =========================================
       CLICK OUTSIDE POPUP
    ========================================== */

    adminModal.addEventListener(
        "click",
        function (event) {

            if (
                event.target === adminModal
            ) {

                closeAdminModal();

            }

        }
    );

</script>


<script src="nav.js"></script>
</body>

</html>
